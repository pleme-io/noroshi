[package]
name = "noroshi"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
description = "Signal-fire alerts for AI coding agents: tell the operator when the agent is done or waiting"
repository = "https://github.com/pleme-io/noroshi"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
okiba = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shikumi = { git = "https://github.com/pleme-io/shikumi", version = "0.1.1077" }
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[lints.clippy]
pedantic = "warn"
